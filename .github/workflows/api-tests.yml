name: API tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent-log-api/requirements-dev.txt

      - name: Install test dependencies
        working-directory: services/agent-log-api
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run API tests
        working-directory: services/agent-log-api
        run: pytest --junitxml=test-results/junit.xml

      - name: Add test summary
        if: ${{ always() }}
        working-directory: services/agent-log-api
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from xml.etree import ElementTree

          report_path = Path("test-results/junit.xml")
          print("## API test results")

          if not report_path.exists():
              print("JUnit XML was not generated. Check the test step output.")
          else:
              root = ElementTree.parse(report_path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              totals = {
                  name: sum(int(suite.attrib.get(name, "0")) for suite in suites)
                  for name in ("tests", "failures", "errors", "skipped")
              }
              print(f"- Tests: {totals['tests']}")
              print(f"- Failures: {totals['failures']}")
              print(f"- Errors: {totals['errors']}")
              print(f"- Skipped: {totals['skipped']}")
          PY

      - name: Upload JUnit XML
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: services/agent-log-api/test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn
